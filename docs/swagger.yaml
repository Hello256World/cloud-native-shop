basePath: /api/v1
definitions:
  apierrors.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
      param:
        type: string
    type: object
  http.AddressRequest:
    properties:
      address:
        maxLength: 500
        minLength: 5
        type: string
      "no":
        maxLength: 20
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
      postal_code:
        type: string
      receiver_name:
        maxLength: 100
        minLength: 2
        type: string
      unit:
        maxLength: 20
        type: string
    required:
    - address
    - phone
    - receiver_name
    type: object
  http.AddressResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      "no":
        type: string
      phone:
        type: string
      postal_code:
        type: string
      receiver_name:
        type: string
      unit:
        type: string
      updated_at:
        type: string
    type: object
  http.AttributeDefinitionRequest:
    properties:
      code:
        maxLength: 50
        minLength: 2
        type: string
      display_order:
        minimum: 0
        type: integer
      is_filterable:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      unit:
        maxLength: 20
        type: string
      value_type:
        enum:
        - text
        - number
        type: string
    required:
    - code
    - name
    - value_type
    type: object
  http.AttributeDefinitionResponse:
    properties:
      code:
        type: string
      display_order:
        type: integer
      id:
        type: integer
      is_filterable:
        type: boolean
      name:
        type: string
      unit:
        type: string
      value_type:
        type: string
    type: object
  http.AttributeDefinitionUpdateRequest:
    properties:
      display_order:
        minimum: 0
        type: integer
      is_filterable:
        type: boolean
      name:
        maxLength: 100
        minLength: 1
        type: string
      unit:
        maxLength: 20
        type: string
    required:
    - name
    type: object
  http.CategoryRequest:
    properties:
      image_name:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
      parent_id:
        type: integer
      slug:
        maxLength: 120
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  http.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image_name:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
    type: object
  http.CreateProductRequest:
    properties:
      attributes:
        items:
          $ref: '#/definitions/http.ProductAttributeRequest'
        maxItems: 50
        type: array
      category_id:
        type: integer
      description:
        maxLength: 10000
        type: string
      images:
        items:
          $ref: '#/definitions/http.ImageRequest'
        maxItems: 20
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 200
        minLength: 2
        type: string
      shipment_weight_g:
        type: integer
      slug:
        maxLength: 220
        minLength: 2
        type: string
      thumbnail:
        maxLength: 255
        type: string
      variants:
        items:
          $ref: '#/definitions/http.VariantRequest'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - category_id
    - name
    - shipment_weight_g
    - slug
    - thumbnail
    - variants
    type: object
  http.FacetResponse:
    properties:
      attribute_id:
        type: integer
      code:
        type: string
      name:
        type: string
      unit:
        type: string
      value_type:
        type: string
      values:
        items:
          $ref: '#/definitions/http.FacetValueResponse'
        type: array
    type: object
  http.FacetValueResponse:
    properties:
      count:
        type: integer
      value:
        type: string
    type: object
  http.ImageRequest:
    properties:
      image_name:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      priority:
        minimum: 0
        type: integer
    required:
    - image_name
    type: object
  http.ImageResponse:
    properties:
      id:
        type: integer
      image_name:
        type: string
      is_active:
        type: boolean
      priority:
        type: integer
    type: object
  http.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  http.OptionResponse:
    properties:
      type:
        type: string
      type_id:
        type: integer
      value:
        type: string
      value_id:
        type: integer
    type: object
  http.ProductAttributeRequest:
    properties:
      attribute_id:
        type: integer
      value:
        maxLength: 200
        type: string
    required:
    - attribute_id
    - value
    type: object
  http.ProductPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.ProductSummaryResponse'
        type: array
      next_cursor:
        type: string
    type: object
  http.ProductRequest:
    properties:
      attributes:
        items:
          $ref: '#/definitions/http.ProductAttributeRequest'
        maxItems: 50
        type: array
      category_id:
        type: integer
      description:
        maxLength: 10000
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 200
        minLength: 2
        type: string
      shipment_weight_g:
        type: integer
      slug:
        maxLength: 220
        minLength: 2
        type: string
      thumbnail:
        maxLength: 255
        type: string
    required:
    - category_id
    - name
    - shipment_weight_g
    - slug
    - thumbnail
    type: object
  http.ProductResponse:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/http.ImageResponse'
        type: array
      is_active:
        type: boolean
      name:
        type: string
      shipment_weight_g:
        type: integer
      slug:
        type: string
      specs:
        items:
          $ref: '#/definitions/http.SpecResponse'
        type: array
      thumbnail:
        type: string
      updated_at:
        type: string
      variants:
        items:
          $ref: '#/definitions/http.VariantResponse'
        type: array
    type: object
  http.ProductSummaryResponse:
    properties:
      category_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      min_price:
        type: integer
      name:
        type: string
      slug:
        type: string
      thumbnail:
        type: string
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.RegisterRequest:
    properties:
      email:
        maxLength: 254
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
    required:
    - full_name
    - password
    - phone
    type: object
  http.SpecResponse:
    properties:
      attribute_id:
        type: integer
      code:
        type: string
      name:
        type: string
      unit:
        type: string
      value:
        type: string
      value_type:
        type: string
    type: object
  http.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  http.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  http.VariantRequest:
    properties:
      is_active:
        type: boolean
      price:
        type: integer
      sku:
        maxLength: 64
        minLength: 2
        type: string
      value_ids:
        items:
          type: integer
        maxItems: 10
        type: array
    required:
    - price
    - sku
    type: object
  http.VariantResponse:
    properties:
      id:
        type: integer
      is_active:
        type: boolean
      options:
        items:
          $ref: '#/definitions/http.OptionResponse'
        type: array
      price:
        type: integer
      sku:
        type: string
    type: object
  http.VariantTypeRequest:
    properties:
      data_type:
        enum:
        - text
        - color
        type: string
      display_order:
        minimum: 0
        type: integer
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - data_type
    - name
    type: object
  http.VariantTypeResponse:
    properties:
      data_type:
        type: string
      display_order:
        type: integer
      id:
        type: integer
      name:
        type: string
      values:
        items:
          $ref: '#/definitions/http.VariantValueResponse'
        type: array
    type: object
  http.VariantUpdateRequest:
    properties:
      is_active:
        type: boolean
      price:
        type: integer
    required:
    - price
    type: object
  http.VariantValueRequest:
    properties:
      display_order:
        minimum: 0
        type: integer
      value:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - value
    type: object
  http.VariantValueResponse:
    properties:
      display_order:
        type: integer
      id:
        type: integer
      value:
        type: string
    type: object
  httpx.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorDetail'
    type: object
  httpx.ErrorDetail:
    properties:
      code:
        type: string
      fields:
        items:
          $ref: '#/definitions/apierrors.FieldError'
        type: array
      message:
        type: string
    type: object
info:
  contact: {}
  description: Modular monolith e-commerce backend.
  title: Cloud Native Shop API
  version: "1.0"
paths:
  /admin/attributes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.AttributeDefinitionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List attribute definitions (admin)
      tags:
      - admin-catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Attribute definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AttributeDefinitionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.AttributeDefinitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create an attribute definition, e.g. RAM (admin)
      tags:
      - admin-catalog
  /admin/attributes/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Attribute ID
        in: path
        name: id
        required: true
        type: integer
      - description: Attribute definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AttributeDefinitionUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AttributeDefinitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update an attribute definition; code and value_type are immutable (admin)
      tags:
      - admin-catalog
  /admin/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.CategoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List all categories (admin)
      tags:
      - admin-catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a category (admin)
      tags:
      - admin-catalog
  /admin/categories/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a category (admin, must have no subcategories or products)
      tags:
      - admin-catalog
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Replace a category (admin)
      tags:
      - admin-catalog
  /admin/products:
    get:
      parameters:
      - description: Opaque cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: Page size (1-50, default 20)
        in: query
        name: limit
        type: integer
      - description: Filter by category id
        in: query
        name: category_id
        type: integer
      - description: Search in product name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List all products incl. inactive (admin, cursor pagination)
      tags:
      - admin-catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Product
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a product with its variants and images in one transaction (admin)
      tags:
      - admin-catalog
  /admin/products/{id}:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Soft-delete a product (admin)
      tags:
      - admin-catalog
    get:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a product by id, including inactive variants (admin)
      tags:
      - admin-catalog
    put:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Replace product fields; variants and images are untouched (admin)
      tags:
      - admin-catalog
  /admin/products/{id}/images:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ImageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add an image to a product (admin)
      tags:
      - admin-catalog
  /admin/products/{id}/images/{imageId}:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image ID
        in: path
        name: imageId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a product image (admin)
      tags:
      - admin-catalog
  /admin/products/{id}/variants:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Variant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.VariantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.VariantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add a variant to a product (admin)
      tags:
      - admin-catalog
  /admin/products/{id}/variants/{variantId}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Variant ID
        in: path
        name: variantId
        required: true
        type: integer
      - description: Variant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.VariantUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.VariantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Change price / active flag of a variant; SKU is immutable (admin)
      tags:
      - admin-catalog
  /admin/variant-types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.VariantTypeResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List variant types with their values (admin)
      tags:
      - admin-catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Variant type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.VariantTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.VariantTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a variant type, e.g. Color (admin)
      tags:
      - admin-catalog
  /admin/variant-types/{id}/values:
    post:
      consumes:
      - application/json
      parameters:
      - description: Variant type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Variant value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.VariantValueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.VariantValueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add a value to a variant type, e.g. Red (admin)
      tags:
      - admin-catalog
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Login with phone and password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Revoke the refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Rotate the refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Register a new customer
      tags:
      - auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.CategoryResponse'
            type: array
      summary: List active categories (flat; build the tree with parent_id)
      tags:
      - catalog
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - me
  /me/addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.AddressResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List my addresses
      tags:
      - me
    post:
      consumes:
      - application/json
      parameters:
      - description: Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.AddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add an address
      tags:
      - me
  /me/addresses/{id}:
    delete:
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete an address
      tags:
      - me
    put:
      consumes:
      - application/json
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      - description: Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.AddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Replace an address
      tags:
      - me
  /products:
    get:
      description: Newest first. Pass the returned next_cursor as `cursor` to get
        the next page; null means last page.
      parameters:
      - description: Opaque cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: Page size (1-50, default 20)
        in: query
        name: limit
        type: integer
      - description: Filter by category id (exact, no descendants)
        in: query
        name: category_id
        type: integer
      - description: Search in product name
        in: query
        name: q
        type: string
      - description: newest (default) | price_asc | price_desc
        enum:
        - newest
        - price_asc
        - price_desc
        in: query
        name: sort
        type: string
      - description: Minimum price (minor units, on the lowest variant price)
        in: query
        name: price_min
        type: integer
      - description: Maximum price
        in: query
        name: price_max
        type: integer
      - description: Attribute filter as code:value, e.g. ram:32 (filterable attributes
          only)
        in: query
        name: attr
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: List active products (cursor pagination)
      tags:
      - catalog
  /products/{slug}:
    get:
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ProductResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Get an active product by slug (only active variants and images)
      tags:
      - catalog
  /products/filters:
    get:
      parameters:
      - description: Limit facets to a category (exact)
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.FacetResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: List filterable attributes with their values and product counts
      tags:
      - catalog
securityDefinitions:
  BearerAuth:
    description: Type "Bearer <access_token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
