version: "2"

sql:
  - engine: postgresql
    schema:
      - migrations/platform
      - migrations/identity
    queries: internal/identity/adapters/postgres/queries
    gen:
      go:
        package: db
        out: internal/identity/adapters/postgres/db
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
