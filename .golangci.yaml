version: "2"

run:
  timeout: 3m

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - errorlint            # errors.Is/As به‌جای == و type assertion
    - bodyclose
    - misspell
  settings:
    depguard:
      rules:
        # قانون ۶: domain هیچ چیز بیرونی import نمی‌کند
        domain-pure:
          files:
            - "**/internal/*/domain/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must not import gin
            - pkg: github.com/jackc/pgx
              desc: domain must not import pgx
            - pkg: github.com/redis/go-redis
              desc: domain must not import redis
            - pkg: github.com/Hello256World/cloud-native-shop/pkg/apierrors
              desc: domain must not import apierrors
            - pkg: github.com/Hello256World/cloud-native-shop/pkg/logger
              desc: domain must not import logger

        # usecase و ports هم نباید به infra وابسته باشند
        usecase-no-infra:
          files:
            - "**/internal/*/usecase/**"
            - "**/internal/*/ports/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: usecase/ports must not import gin
            - pkg: github.com/jackc/pgx
              desc: usecase/ports must not import pgx (use ports)
            - pkg: github.com/redis/go-redis
              desc: usecase/ports must not import redis
            - pkg: github.com/Hello256World/cloud-native-shop/pkg/apierrors
              desc: apierrors belongs to adapters/http only

  exclusions:
    paths:
      - docs        # generated by swag
    rules:
      - path: _test\.go
        linters: [errcheck]